<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>בדיקת דיוק — מדגם גגות</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #111; color: #eee; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
      .cell { position: relative; height: 300px; }
      .cell .m { position: absolute; inset: 0; }
      .lbl { position: absolute; z-index: 1000; top: 4px; right: 4px; background: rgba(0,0,0,.75); color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 4px; direction: ltr; }
      .leaflet-control-attribution { display: none; }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data/data.js"></script>
    <script>
      // Deterministic stratified random sample (seed 42) so the review is reproducible.
      function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rand = rng(42);
      const STRATA = [
        ['ms_only', 'agricultural', 12], ['ms_only', 'unmapped', 6], ['ms_only', 'industrial', 6],
        ['both', null, 6], ['osm_only', null, 6],
      ];
      const all = window.PILOT.candidates.features;
      const sample = [];
      const tierParam = new URLSearchParams(location.search).get('tier');
      if (tierParam) {
        const pool = all.filter((f) => f.properties.tier === tierParam);
        const r2 = rng(7); const picked = new Set();
        while (picked.size < Math.min(12, pool.length)) picked.add(Math.floor(r2() * pool.length));
        [...picked].forEach((i) => sample.push(pool[i]));
      } else for (const [src, ctx, n] of STRATA) {
        const pool = all.filter((f) => f.properties.source === src && (!ctx || f.properties.context === ctx));
        const picked = new Set();
        while (picked.size < Math.min(n, pool.length)) picked.add(Math.floor(rand() * pool.length));
        [...picked].forEach((i) => sample.push(pool[i]));
      }
      window.SAMPLE = sample.map((f, i) => ({ n: i + 1, ...f.properties }));
      const page = Number(new URLSearchParams(location.search).get('page') || 1);
      const slice = sample.slice((page - 1) * 12, page * 12);
      const grid = document.getElementById('grid');
      slice.forEach((f, k) => {
        const n = (page - 1) * 12 + k + 1;
        const p = f.properties;
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerHTML = `<div class="m" id="m${n}"></div><div class="lbl">#${n} ${p.source}/${p.landuse ?? p.context} ${p.areaSqm}m²</div>`;
        grid.appendChild(cell);
        const m = L.map(`m${n}`, { zoomControl: false, attributionControl: false });
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 18 }).addTo(m);
        const layer = L.geoJSON(f, { style: { color: '#ffea00', weight: 2, fill: false } }).addTo(m);
        m.fitBounds(layer.getBounds(), { padding: [30, 30], maxZoom: 18 });
      });
    </script>
  </body>
</html>
